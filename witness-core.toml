[watch]
roots = ["src", "plugins", "examples/engentus", "examples/_lib"]
ignore = ["node_modules", "target", ".git", ".witness-core"]

[proof]
fast = "node --test src/runtime-surface-interaction-runtime.test.js"
full = "npm test"
slow_ms = 15000

[package]
include = ["src/**", "plugins/**", "examples/engentus/**", "examples/_lib/**"]

[supervise]
command = "npm run app:engentus"
working_dir = "."
restart_on_exit = true
