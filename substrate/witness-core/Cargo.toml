[package]
name = "witness-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "witness-core"
path = "src/main.rs"

[dependencies]
wasmtime = "30"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
base64 = "0.22"
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql = "26"
sysinfo = "0.30"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
named_pipe = "0.4"
