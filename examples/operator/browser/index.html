<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Operator Example</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050806;
        color: #d7e2d2;
        font-family: Consolas, "Cascadia Mono", "Courier New", monospace;
      }
      body {
        display: grid;
        place-items: stretch;
      }
      #operator-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #050806;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="operator-canvas" aria-label="Operator Browser Prototype"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
  </html>
