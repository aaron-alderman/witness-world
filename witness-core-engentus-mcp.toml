[watch]
roots = ["src", "plugins", "examples/engentus", "examples/_lib"]
ignore = ["node_modules", "target", ".git", ".witness-core"]

[proof]
fast = "node --test src/runtime-surface-interaction-runtime.test.js"
full = "npm test"
slow_ms = 15000

[package]
include = ["src/**", "plugins/**", "examples/engentus/**", "examples/_lib/**"]

[supervise]
command = "node src/cli.js utility-mcp examples/engentus --mcp engentus_mcp --server engentus_server --transport http --runtime-profile full"
working_dir = "."
restart_on_exit = true
transport_only_runtime = true
health_interval_ms = 1000
health_timeout_ms = 5000
restart_on_unhealthy = true
degraded_grace_polls = 10
unhealthy_grace_polls = 3

[frontdoor]
public_addr = "127.0.0.1:8791"
drain_timeout_ms = 15000
startup_cutover_timeout_ms = 45000
